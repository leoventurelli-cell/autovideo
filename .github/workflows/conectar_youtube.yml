name: Conectar YouTube

on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Cole aqui o código que apareceu no painel depois de autorizar o YouTube"
        required: true

permissions:
  contents: write

jobs:
  conectar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests cryptography

      - name: Trocar o código pelo acesso
        env:
          YT_CLIENT_ID: ${{ vars.YT_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          CODIGO: ${{ github.event.inputs.codigo }}
        run: python conectar_youtube.py "$CODIGO"

      - name: Guardar a conexão (criptografada)
        run: |
          git config user.name "autovideo-bot"
          git config user.email "autovideo-bot@users.noreply.github.com"
          git add youtube.token docs/config.json
          git commit -m "YouTube conectado"
          git pull --rebase && git push
