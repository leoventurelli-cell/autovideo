name: Preparar para o celular

# Faz a cópia leve de um Short que já está no painel, para o botão "Mandar pro TikTok" no celular.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "ID do vídeo (aparece no painel)"
        required: true

permissions:
  contents: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  celular:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          command -v ffmpeg || (timeout 240 bash -c "sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg")
      - name: Preparar
        env:
          ID: ${{ github.event.inputs.id }}
        run: python celular.py --id "$ID"
      - name: Salvar no painel
        run: |
          git config user.name "autovideo-bot"
          git config user.email "autovideo-bot@users.noreply.github.com"
          git add docs/videos.json && git add -A docs/tiktok
          git diff --cached --quiet || (git commit -m "Short pronto para o celular" && git pull --rebase && git push)
