name: Conta do TikTok

# Atualiza a conta mostrada na tela "Postar no TikTok" do painel (nome, foto e opções de privacidade).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"   # todo dia, de manhã

permissions:
  contents: write

jobs:
  conta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install requests cryptography
      - name: Ler a conta
        env:
          TIKTOK_CLIENT_KEY: ${{ vars.TIKTOK_CLIENT_KEY || secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: python -c "import publicar_tiktok, json; print(json.dumps(publicar_tiktok.info_do_criador(), ensure_ascii=False))"
      - name: Salvar no painel
        run: |
          git config user.name "autovideo-bot"
          git config user.email "autovideo-bot@users.noreply.github.com"
          git add docs/tiktok_conta.json tiktok.token
          # salva sem perder o vídeo: se outra execução renovou o token do TikTok/YouTube ao mesmo tempo,
          # fica o token que já está no main (ele já funciona) e o histórico/painel deste vídeo é gravado
          salvar() {
            git diff --cached --quiet && return 0
            git commit -qm "$1"
            for i in 1 2 3 4 5; do
              if git pull --rebase -q; then git push -q && return 0
              else
                for t in tiktok.token youtube.token; do git checkout --ours -- "$t" 2>/dev/null && git add "$t"; done
                if GIT_EDITOR=true git rebase --continue; then git push -q && return 0; fi
                git rebase --abort
              fi
              sleep $((i * 5))
            done
            echo "::error::Não consegui salvar o histórico/painel"; return 1
          }
          salvar "conta do TikTok"
