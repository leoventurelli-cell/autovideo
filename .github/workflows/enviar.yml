name: Enviar vídeo

# Envia para as redes um vídeo que já está no painel (botões do site).
on:
  workflow_dispatch:
    inputs:
      id:
        description: "ID do vídeo (aparece no painel)"
        required: true
      redes:
        description: "Para onde enviar"
        type: choice
        options: [youtube, tiktok, ambos]
        default: youtube

permissions:
  contents: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Enviar
        env:
          YT_CLIENT_ID: ${{ vars.YT_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_PRIVACIDADE: ${{ vars.YT_PRIVACIDADE }}
          TIKTOK_CLIENT_KEY: ${{ vars.TIKTOK_CLIENT_KEY || secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_MODO: ${{ vars.TIKTOK_MODO }}
          ID: ${{ github.event.inputs.id }}
          REDES: ${{ github.event.inputs.redes }}
        run: python enviar.py --id "$ID" --redes "$REDES"

      - name: Atualizar painel
        if: always()
        run: |
          git config user.name "autovideo-bot"
          git config user.email "autovideo-bot@users.noreply.github.com"
          for f in docs/videos.json tiktok.token youtube.token; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --cached --quiet || (git commit -m "vídeo enviado" && git pull --rebase && git push)
