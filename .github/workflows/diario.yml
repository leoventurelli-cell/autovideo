name: Vídeo diário

on:
  schedule:
    # Short todo dia às 11:47 de Brasília (14:47 UTC)
    - cron: "47 14 * * *"
    # Vídeo longo (YouTube) + o Short dele todo dia às 18:17 de Brasília (21:17 UTC)
    - cron: "17 21 * * *"
  workflow_dispatch:   # botão "Run workflow" para rodar na hora
    inputs:
      formato:
        description: "Formato do vídeo"
        type: choice
        options: [curto, longo]
        default: curto
      tema:
        description: "Tema específico (opcional)"
        required: false
      publicar:
        description: "Publicar nas redes? (desmarque para só gerar e baixar o vídeo)"
        type: boolean
        default: true

permissions:
  contents: write

# um vídeo por vez: pedidos repetidos esperam na fila em vez de brigar ao salvar o painel
concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg
        timeout-minutes: 10
        run: |
          if ! command -v ffmpeg >/dev/null; then
            # 1ª opção: apt (com tempo limite); se o servidor do Ubuntu travar, usa a versão estática
            if ! timeout 240 bash -c "sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg"; then
              echo "apt lento: baixando FFmpeg estático"
              curl -sSL --retry 3 -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
              mkdir -p /tmp/ffmpeg && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
              sudo cp /tmp/ffmpeg/ffmpeg /tmp/ffmpeg/ffprobe /usr/local/bin/
            fi
          fi
          ffmpeg -hide_banner -filters | grep -q " ass " && echo "FFmpeg ok (com legendas)"
          mkdir -p fontes
          [ -f fontes/Poppins-Bold.ttf ] || curl -sSL -o fontes/Poppins-Bold.ttf \
            https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar e publicar
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ vars.YT_CLIENT_ID || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ vars.TIKTOK_CLIENT_KEY || secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          # Configurações sem segredo ficam em Settings → Variables
          NICHO: ${{ vars.NICHO }}
          VOZ: ${{ vars.VOZ }}
          YT_PRIVACIDADE: ${{ vars.YT_PRIVACIDADE }}
          TIKTOK_MODO: ${{ vars.TIKTOK_MODO }}
          PUBLICAR_YOUTUBE: ${{ vars.PUBLICAR_YOUTUBE }}
          PUBLICAR_TIKTOK: ${{ vars.PUBLICAR_TIKTOK }}
          TEMA: ${{ github.event.inputs.tema }}
          FORMATO: ${{ github.event.inputs.formato || (github.event.schedule == '17 21 * * *' && 'longo') || 'curto' }}
          SO_GERAR: ${{ github.event.inputs.publicar == 'false' }}
        run: |
          ARGS=()
          [ -n "$TEMA" ] && ARGS+=(--tema "$TEMA")
          [ "$SO_GERAR" = "true" ] && ARGS+=(--sem-publicar)
          python main.py "${ARGS[@]}"

      - name: Publicar o MP4 para download (link direto no painel)
        if: always() && hashFiles('saida/release.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          d = json.load(open("saida/release.json"))
          open("notas.md", "w").write(d["legenda"])
          subprocess.run(["gh", "release", "create", d["tag"], *d["arquivos"],
                          "--title", d["titulo"], "--notes-file", "notas.md", "--latest=false"], check=True)
          PY

      - name: Novas sugestões de tema para o painel
        if: always()
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NICHO: ${{ vars.NICHO }}
        run: python sugerir.py

      - name: Salvar histórico e painel
        if: always()
        run: |
          git config user.name "autovideo-bot"
          git config user.email "autovideo-bot@users.noreply.github.com"
          for f in historico.json temas.txt docs/videos.json docs/config.json docs/sugestoes.json tiktok.token youtube.token; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --cached --quiet || (git commit -m "novo vídeo" && git pull --rebase && git push)
